<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Админ-панель | Меню</title>
  <script type="module" src="admin.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
</head>

<body class="bg-gray-100 p-10">
  <div class="max-w-xl mx-auto bg-white shadow-lg p-6 rounded-2xl">

    <h2 class="text-2xl font-bold mb-4">Добавить позицию меню</h2>

    <form id="addItemForm" class="space-y-4">

      <div>
        <label class="font-semibold">Название:</label>
        <input id="name" class="w-full p-2 border rounded" required />
      </div>

      <div>
        <label class="font-semibold">Изображение (URL):</label>
        <input id="image" class="w-full p-2 border rounded" required />
      </div>

      <div>
        <label class="font-semibold">Состав:</label>
        <textarea id="compound" class="w-full p-2 border rounded" required></textarea>
      </div>

      <div>
        <label class="font-semibold">Цена:</label>
        <input id="price" type="number" class="w-full p-2 border rounded" required />
      </div>

      <div>
        <label class="font-semibold">Категория:</label>
        <select id="category" class="w-full p-2 border rounded" required>
          <option value="1">Пиццы</option>
          <option value="3">Закуски</option>
          <option value="2">Десерты</option>
        </select>
      </div>

      <button type="submit"
        class="w-full bg-yellow-600 hover:bg-yellow-700 text-white py-2 rounded-xl">
        Добавить
      </button>

    </form>

    <p id="statusMsg" class="mt-4 text-lg font-semibold"></p>

  </div>
</body>
</html>
