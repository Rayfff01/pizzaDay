<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Аккаунт — Pizza Day</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script type="module" src="firebaseConfig.js"></script>
  <script type="module" src="account.js"></script>
</head>
<body class="flex items-center justify-center min-h-screen bg-gradient-to-br from-blue-100 to-yellow-100 font-sans">

  <div class="bg-white p-10 rounded-xl shadow-lg w-full max-w-md text-center">

    <h1 class="text-2xl font-bold text-yellow-600 mb-4">Ваш аккаунт</h1>

    <!-- Блок имени -->
    <div class="mb-4">
      <p class="text-gray-700">
        Имя: <span id="userName" class="font-semibold">...</span>
        <button id="editNameButton" class="ml-2 text-sm text-blue-600 hover:underline">Изменить</button>
      </p>

      <!-- Поле изменения имени (изначально скрыто) -->
      <div id="editNameContainer" class="mt-3 hidden">
        <input 
          id="newNameInput" 
          type="text"
          placeholder="Введите новое имя"
          class="w-full px-3 py-2 mb-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-yellow-400"
        />
        <button id="saveNameButton"
                class="w-full bg-green-500 text-white py-2 rounded-md hover:bg-green-600 transition">
          Сохранить
        </button>
      </div>
    </div>

    <p class="text-gray-700 mb-6">Email: <span id="userEmail">...</span></p>

    <button id="logoutButton" 
            class="w-full bg-red-500 text-white font-semibold py-2 rounded-md hover:bg-red-600 transition">
      Выйти
    </button>

    <a href="index.html"
       class="w-full mt-3 block bg-blue-500 text-white font-semibold py-2 rounded-md hover:bg-blue-600 transition">
      Вернуться на главную
    </a>

  </div>

</body>
</html>
