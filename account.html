<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Аккаунт — Pizza Day</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script type="module" src="firebaseConfig.js"></script>
  <script type="module" src="account.js"></script>

  <style>
    /* Кастомный стиль для красивой тени, похожей на "коробочку для пиццы" */
    .pizza-box-shadow {
      /* Используем более приглушенный желтый для тени/ободка */
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05), 0 0 0 5px rgba(251, 191, 36, 0.4); 
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-amber-50 font-sans">

  <div class="bg-white p-8 sm:p-10 rounded-2xl pizza-box-shadow w-full max-w-sm sm:max-w-md text-center border-t-8 border-red-700">
    
    <div class="text-center mb-6">
      <i class="fas fa-pizza-slice text-4xl text-amber-600 mb-2"></i> 
      <h1 class="text-3xl font-extrabold text-red-700">Ваш аккаунт</h1>
      <p class="text-gray-600 text-sm">Управляйте своими данными</p>
    </div>

    <div class="space-y-4 mb-6 text-left">
      <div class="p-3 bg-gray-50 rounded-lg border border-amber-400 flex justify-between items-center">
        <div class="flex items-center">
          <i class="fas fa-user-circle text-xl text-amber-700 mr-3"></i>
          <p class="text-gray-700 font-medium">Имя:</p>
          <span id="userName" class="ml-2 font-bold text-red-700">...</span>
        </div>
        <button id="editNameButton" class="text-sm text-red-600 hover:text-red-800 font-semibold transition">
          <i class="fas fa-edit mr-1"></i> Изменить
        </button>
      </div>

      <div id="editNameContainer" class="mt-3 hidden bg-white p-4 rounded-lg shadow-inner border border-amber-400">
        <input 
          id="newNameInput" 
          type="text"
          placeholder="Введите новое имя"
          class="w-full px-4 py-2 mb-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-amber-600 transition"
        />
        <button id="saveNameButton"
                class="w-full flex items-center justify-center bg-green-700 text-white font-semibold py-2 rounded-md hover:bg-green-800 transition duration-300 transform hover:scale-105">
          <i class="fas fa-check-circle mr-2"></i> Сохранить
        </button>
      </div>

      <div class="p-3 bg-gray-50 rounded-lg border border-amber-400 flex items-center">
        <i class="fas fa-envelope text-xl text-amber-700 mr-3"></i>
        <p class="text-gray-700 font-medium">Email:</p>
        <span id="userEmail" class="ml-2 font-semibold text-gray-800 truncate">...</span>
      </div>
    </div>
    
    <div class="space-y-3">
      <button id="logoutButton" 
              class="w-full flex items-center justify-center bg-red-700 text-white font-bold py-3 rounded-md shadow-md hover:bg-red-800 transition duration-300 transform hover:scale-[1.01]">
        <i class="fas fa-sign-out-alt mr-2"></i> Выйти из аккаунта
      </button>

      <a href="index.html"
         class="w-full block text-center bg-amber-600 text-white font-bold py-3 rounded-md shadow-md hover:bg-amber-700 transition duration-300 transform hover:scale-[1.01]">
        <i class="fas fa-home mr-2"></i> Вернуться на главную
      </a>
    </div>

  </div>

</body>
</html>
