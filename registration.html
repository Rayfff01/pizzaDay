<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Регистрация — Pizza Day</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- Скрипт регистрации -->
  <script type="module" src="registration.js"></script>
</head>
<body class="flex items-center justify-center min-h-screen bg-gradient-to-br from-blue-100 to-yellow-100 font-sans">

  <div class="bg-white p-10 rounded-xl shadow-lg w-full max-w-md">
    <div class="text-center text-orange-500 text-2xl font-bold mb-6">🍕 Pizza Day</div>
    <h1 class="text-center text-xl font-semibold mb-6 text-gray-800">Регистрация</h1>

    <form id="registerForm" class="space-y-4" onsubmit="return false;">
      <div>
        <label for="firstname" class="block text-gray-700 text-sm mb-1">Имя</label>
        <input type="text" id="firstname" placeholder="Ваше имя" required
               class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:border-orange-500">
      </div>

      <div>
        <label for="email" class="block text-gray-700 text-sm mb-1">Email</label>
        <input type="email" id="email" placeholder="mail@example.com" required
               class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:border-orange-500">
      </div>

      <div>
        <label for="password" class="block text-gray-700 text-sm mb-1">Пароль</label>
        <input type="password" id="password" placeholder="••••••••" required
               class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:border-orange-500">
      </div>

      <div>
        <label for="passwordConfirm" class="block text-gray-700 text-sm mb-1">Подтвердите пароль</label>
        <input type="password" id="passwordConfirm" placeholder="••••••••" required
               class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:border-orange-500">
      </div>

      <button type="button" id="registerButton"
              class="w-full bg-orange-500 text-white font-semibold py-2 rounded-md hover:bg-orange-600 transition-colors">
        Зарегистрироваться
      </button>

      <div class="text-center text-gray-500 text-sm mt-4">
        Уже есть аккаунт? <a href="auth.html" class="text-orange-500 hover:underline">Войти</a>
      </div>
    </form>
  </div>

</body>
</html>
